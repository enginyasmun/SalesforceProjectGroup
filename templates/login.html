{% extends 'base.html' %}{% block title %}Sign in | Project Group{% endblock %}{% block public_content %}
<section class="auth-shell"><div class="auth-copy"><span class="eyebrow">Welcome back</span><h1>Open your Project Group workspace.</h1><p>Continue weekly work, project learning, reviews, and student tracking.</p></div><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Sign in</h2><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-dark full" type="submit">Sign in</button><p>New student? <a href="{{ url_for('register') }}">Register here</a></p></form></section>
{% endblock %}
