{% extends 'base.html' %}{% block title %}Sign in | Project Group{% endblock %}{% block public_content %}<section class="auth-shell"><div class="auth-copy"><span class="eyebrow">Welcome back</span><h1>Continue your project journey.</h1><p>Students, instructors, and administrators use the same secure sign-in.</p></div><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Sign in</h2><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-dark full" type="submit">Sign in</button><p class="form-note">New student? <a href="{{ url_for('register') }}">Create an account</a>.</p></form></section>{% endblock %}
