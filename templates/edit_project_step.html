{% extends 'base.html' %}{% block title %}Edit project step | Project Group{% endblock %}{% block area %}Projects{% endblock %}{% block page_name %}Edit step {{ step.step_number }}{% endblock %}{% block content %}
<a class="back-link" href="{{ url_for('manage_project', project_id=step.project_id) }}">← Back to project</a><form class="card form-card project-edit-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><span class="eyebrow">Project step</span><h1>{{ step.title }}</h1><div class="field-pair"><label>Step number<input type="number" min="1" name="step_number" value="{{ step.step_number }}" required></label><label>Phase<input name="phase" value="{{ step.phase }}" required></label></div><label>Title<input name="title" value="{{ step.title }}" required></label><label>Summary<textarea name="summary" rows="3">{{ step.summary or '' }}</textarea></label><div class="field-pair"><label>Tasks, one per line<textarea name="tasks" rows="10">{{ step.tasks or '' }}</textarea></label><label>Deliverables, one per line<textarea name="deliverables" rows="10">{{ step.deliverables or '' }}</textarea></label></div><label>Source reference<input name="source_reference" value="{{ step.source_reference or '' }}"></label><label class="checkbox-line"><input type="checkbox" name="is_published" value="1" {% if step.is_published %}checked{% endif %}> Published to students</label><button class="button button-dark" type="submit">Save project step</button></form>
{% endblock %}
