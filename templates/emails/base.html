<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5ef;font-family:Arial,sans-serif;color:#171913;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5ef;padding:28px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;width:100%;background:#ffffff;border:1px solid #dfe1d8;border-radius:20px;overflow:hidden;">
          <tr>
            <td style="background:#171913;padding:24px 28px;">
              <table role="presentation" width="100%">
                <tr>
                  <td>
                    <div style="display:inline-block;background:#c9ff67;color:#171913;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;">PG</div>
                  </td>
                  <td align="right" style="color:#d3d9cd;font-size:13px;font-weight:700;">Salesforce Project Group</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:30px 28px 18px 28px;">
              <div style="font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#667331;margin-bottom:10px;">{{ eyebrow or 'Portal update' }}</div>
              <h1 style="margin:0 0 12px 0;font-size:32px;line-height:1.06;color:#171913;">{{ heading }}</h1>
              <p style="margin:0;color:#60655c;font-size:16px;line-height:1.6;">{{ intro }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 10px 28px;">
              {% block email_content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:10px 28px 28px 28px;">
              <a href="{{ portal_url }}" style="display:inline-block;background:#171913;color:#ffffff;text-decoration:none;padding:14px 18px;border-radius:12px;font-weight:800;">Open the portal</a>
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #e4e7de;padding:18px 28px;color:#7a8074;font-size:12px;line-height:1.6;">
              Salesforce Project Group<br>
              Weekly work · Presentation homework · Project learning
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
