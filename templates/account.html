{% extends 'base.html' %}
{% block title %}Account | Salesforce Project Group{% endblock %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">Account settings</span><h1>Keep your information current.</h1><p>Update your name or email. Enter your existing password only when changing the password.</p></div></div>
<section class="settings-grid">
  <form class="form-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h2>Profile</h2>
    <label class="field"><span>Full name</span><input name="name" value="{{ user.name }}" required></label>
    <label class="field"><span>Email</span><input type="email" name="email" value="{{ user.email }}" required></label>
    <button class="button button-primary" type="submit">Save profile</button>
  </form>
  <form class="form-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="name" value="{{ user.name }}">
    <input type="hidden" name="email" value="{{ user.email }}">
    <h2>Change password</h2>
    <label class="field"><span>Current password</span><input type="password" name="current_password" autocomplete="current-password"></label>
    <label class="field"><span>New password</span><input type="password" name="new_password" minlength="8" autocomplete="new-password"><small>At least 8 characters.</small></label>
    <button class="button button-secondary" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
