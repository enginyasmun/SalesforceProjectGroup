{% extends 'base.html' %}{% block area %}Account{% endblock %}{% block page_name %}Profile and password{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">Account settings</span><h1>Keep your profile current.</h1></div></div><form class="card form-card narrow-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full name<input name="name" value="{{ user.name }}" required></label><label>Email<input type="email" name="email" value="{{ user.email }}" required></label><div class="form-divider"><span>Change password only when needed</span></div><label>Current password<input type="password" name="current_password"></label><label>New password<input type="password" name="new_password" minlength="8"></label><button class="button button-dark" type="submit">Save account</button></form>
{% endblock %}
