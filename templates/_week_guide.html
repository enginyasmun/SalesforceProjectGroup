<section class="learning-loop">{% for item in week.steps %}<article class="card loop-card"><span>{{ '%02d'|format(loop.index) }}</span><div><small>{{ item.title }}</small><ul>{% for action in item.actions %}<li>{{ action }}</li>{% endfor %}</ul><strong>Output: {{ item.output }}</strong></div></article>{% endfor %}</section>
